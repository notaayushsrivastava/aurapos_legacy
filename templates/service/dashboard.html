{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Recent Bills -->
    <div class="lg:col-span-2 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6">
        <h3 class="font-bold mb-4">Recent Bills</h3>
        <!-- Table or List goes here -->
    </div>

    <!-- Quick Actions -->
    <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6">
        <h3 class="font-bold mb-4">Quick Actions</h3>
        <button class="w-full bg-pink-500 text-white py-2 rounded-lg mb-2">New Bill</button>
    </div>

    <!-- Revenue Chart -->
    <div class="lg:col-span-3 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6">
        <h3 class="font-bold mb-4">Revenue Chart</h3>
        <div class="h-64 bg-slate-50 dark:bg-slate-800 rounded-xl">
            <!-- Canvas for Chart.js goes here -->
        </div>
    </div>
</div>
