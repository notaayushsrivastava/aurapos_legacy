{% extends "layout.html" %}

{% block title %}Reset Password — AuraPOS{% endblock %}

{% block public_content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-4 sm:p-6 lg:p-8 bg-neutral-100 dark:bg-[#0d0c0a]"
     x-data="forgotPasswordApp()">
  
  <div data-anim="scale" class="w-full max-w-md bg-white dark:bg-[#141210] rounded-3xl border border-neutral-200 dark:border-neutral-800 shadow-2xl p-6 sm:p-8 space-y-6 relative overflow-hidden">
    
    <!-- Header & Icon -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-violet-50 dark:bg-violet-950/40 border border-violet-200 dark:border-violet-800/40 text-violet-600 dark:text-neon-cyan flex items-center justify-center">
        <i data-lucide="key-round" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-black tracking-tight text-neutral-900 dark:text-white">
        Forgot Password?
      </h2>
      <p class="text-xs text-neutral-500 dark:text-neutral-400">
        Enter your registered email address or phone number to recover your credentials.
      </p>
    </div>

    <!-- Success Message Card -->
    <div x-show="submitted && successMessage" 
         x-cloak
         x-transition:enter="transition ease-out duration-300 transform"
         x-transition:enter-start="opacity-0 -translate-y-2"
         x-transition:enter-end="opacity-100 translate-y-0"
         class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/80 text-emerald-900 dark:text-emerald-200 text-xs flex items-start gap-3">
      <i data-lucide="check-circle" class="w-5 h-5 text-emerald-500 shrink-0 mt-0.5"></i>
      <div>
        <p class="font-bold">Check your inbox</p>
        <p class="mt-0.5 text-emerald-700 dark:text-emerald-300" x-text="successMessage"></p>
      </div>
    </div>

    <!-- Async Form -->
    <form @submit.prevent="submitForgotPassword()" class="space-y-4" x-show="!submitted">
      
      <div>
        <label for="identifier" class="block text-xs font-bold uppercase tracking-wider text-neutral-500 dark:text-neutral-400 mb-1.5">
          Email or Phone Number
        </label>
        <div class="relative flex items-center">
          <div class="absolute left-3.5 flex items-center justify-center pointer-events-none text-neutral-400">
            <i data-lucide="user-check" class="w-4 h-4"></i>
          </div>
          <input type="text" 
                 id="identifier" 
                 x-model="identifier" 
                 required 
                 placeholder="name@aurasalon.com or 9876543210" 
                 class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 text-xs text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-violet-500/70 dark:focus:ring-neon-cyan/50 transition-colors">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" 
                :disabled="isLoading"
                class="w-full py-3 rounded-xl btn-brand text-white hover:opacity-95 disabled:opacity-50 font-bold text-xs shadow-md transition-all flex items-center justify-center gap-2 active:scale-98">
          <i data-lucide="send" class="w-4 h-4" x-show="!isLoading"></i>
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin" x-show="isLoading"></i>
          <span x-text="isLoading ? 'Sending Request...' : 'Send Recovery Link'"></span>
        </button>
      </div>

    </form>

    <!-- Back to Login -->
    <div class="text-center pt-2 border-t border-neutral-100 dark:border-neutral-800 text-xs">
      <a href="{{ url_for('login') }}" class="font-bold text-neutral-600 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-white transition-colors inline-flex items-center gap-1.5">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Return to Sign In</span>
      </a>
    </div>

  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
  function forgotPasswordApp() {
    return {
      identifier: '',
      isLoading: false,
      submitted: false,
      successMessage: '',

      async submitForgotPassword() {
        if (!this.identifier.trim()) return;

        this.isLoading = true;

        try {
          const res = await fetch("{{ url_for('forgotpassword') }}", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ identifier: this.identifier.trim() })
          });

          const data = await res.json();
          this.successMessage = data.message || "If an account exists with this email/phone, recovery instructions have been sent.";
          this.submitted = true;
        } catch (e) {
          window.uiToast("Unable to process request. Please try again.", "error");
        } finally {
          this.isLoading = false;
        }
      }
    };
  }
</script>
{% endblock %}
