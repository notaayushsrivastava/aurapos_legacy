<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Salon Billing Software{% endblock %}</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='output.css') }}"
    />
  </head>

  <body
    class="min-h-screen flex flex-col bg-slate-100 text-slate-800 transition-colors duration-300
           dark:bg-slate-950 dark:text-slate-100"
  >
    <!-- Header -->
    <header
      class="sticky top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur-md shadow-sm
             dark:bg-slate-900/80 dark:border-slate-800"
    >
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4"
      >
        <!-- Logo -->
        <a href="{{ url_for('index') }}"
           class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
          Salon Billing
        </a>

        <!-- Navigation -->
        <nav>
          <ul class="flex items-center gap-2">

            <li>
              <a
                href="{{ url_for('index') }}"
                class="rounded-lg px-4 py-2 transition
                {% if request.endpoint == 'home' %}
                  bg-pink-500 text-white shadow
                {% else %}
                  hover:bg-slate-200 dark:hover:bg-slate-800
                {% endif %}"
              >
                Home
              </a>
            </li>

            <li>
              <a
                href="{{ url_for('services') }}"
                class="rounded-lg px-4 py-2 transition
                {% if request.endpoint == 'services' %}
                  bg-pink-500 text-white shadow
                {% else %}
                  hover:bg-slate-200 dark:hover:bg-slate-800
                {% endif %}"
              >
                Services
              </a>
            </li>

            <li>
              <a
                href="{{ url_for('billing') }}"
                class="rounded-lg px-4 py-2 transition
                {% if request.endpoint == 'billing' %}
                  bg-pink-500 text-white shadow
                {% else %}
                  hover:bg-slate-200 dark:hover:bg-slate-800
                {% endif %}"
              >
                Billing
              </a>
            </li>

            <li>
              <a
                href="{{ url_for('contact') }}"
                class="rounded-lg px-4 py-2 transition
                {% if request.endpoint == 'contact' %}
                  bg-pink-500 text-white shadow
                {% else %}
                  hover:bg-slate-200 dark:hover:bg-slate-800
                {% endif %}"
              >
                Contact
              </a>
            </li>

          </ul>
        </nav>
        <button
            id="theme-toggle"
            class="rounded-lg border border-slate-300 dark:border-slate-700 px-3 py-2 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
        >
            🌙
        </button>

        <script>
        const html = document.documentElement;
        const btn = document.getElementById("theme-toggle");

        // Restore saved theme
        if (localStorage.theme === "dark") {
            html.classList.add("dark");
        } else if (localStorage.theme === "light") {
            html.classList.remove("dark");
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            html.classList.add("dark");
        }

        btn.onclick = () => {
            html.classList.toggle("dark");
            localStorage.theme = html.classList.contains("dark") ? "dark" : "light";
        };
        </script>
      </div>
    </header>

    <!-- Main -->
    <main class="flex-1">
      <div class="max-w-7xl mx-auto px-6 py-8">

        <div
          class="rounded-2xl border border-slate-200 bg-white shadow-sm p-6
                 dark:border-slate-800 dark:bg-slate-900"
        >
          {% block content %}
          {% endblock %}
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer
      class="border-t border-slate-200 bg-white
             dark:bg-slate-900 dark:border-slate-800"
    >
      <div
        class="max-w-7xl mx-auto px-6 py-5 flex flex-col md:flex-row justify-between items-center gap-2"
      >
        <p class="text-sm text-slate-600 dark:text-slate-400">
          &copy; 2026 Aayush Srivastava. All rights reserved.
        </p>

        <p class="text-sm text-slate-500 dark:text-slate-500">
          Flask • Tailwind CSS
        </p>
      </div>
    </footer>
  </body>
</html>
